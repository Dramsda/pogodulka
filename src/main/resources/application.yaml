spring:
  application:
    name: pogodulka

  # Nie uruchamiaj kontenera z compose.yaml przy starcie (brak Dockera)
  docker:
    compose:
      enabled: false

  # Wbudowana baza H2 w pamieci
  datasource:
    url: jdbc:h2:mem:pogodulka;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop

  # Konsola H2 dostepna pod http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console
